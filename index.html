<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: linear-gradient(180deg,#1f1f1f 0%, #161616 60% ,#0d0d0d 100%);
            height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .box-login{
            background-color: #282828;
            width: 350px;
            height: 350px;
            border-radius: 8px;
            margin: 30px auto;
            padding: 20px;
        
        }
        

        h3, p {
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
        }

        #user, #senha {
            
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;

        }

        label {
            color: #fff;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background-color: #161616;
            color: #fff;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

    </style>
</head>
<body> 
    <div class="box-login">
        <h3>Login</h3>
        <p>Sistema de Autenticação</p>

        <div>
            <label for="user">Usuário:</label>
            <input type="text" id="user">
        </div>
        
        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha">
        </div>

        <div>
            <input type="checkbox" id="termodeuso" >
            <label for="termodeuso">Li e concordo com os termos de uso.</label>
        </div>

        <div>
            <button type="button" onclick="logar()">Entrar</button>
        </div>
    </div>

    <Script>
        function logar() {
            let var_user = document.querySelector('#user').value;
            let var_senha = document.querySelector('#senha').value;
            let var_termos = document.querySelector('#termodeuso').checked
            
            if ( var_user == '' ) {
                alert("O Campo Usuário é Obrigatório!");
                return
            }

            if (var_senha == '' ) {
                alert("O Campo Senha é Obrigatório!");
                return
            }

            if (var_termos == false) {
                alert("É necessário Ler e Aceitar os termos.")
                return
            } 

            if (var_user == "admin" && var_senha == "admin" && var_termos == true) {
                alert ("Admin Logado com Sucesso!");
            }
            else {
                alert("Usuário e Senha incorretos!");
            }

        }

    </Script>
</body>
</html>
