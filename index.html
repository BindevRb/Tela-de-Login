<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Style.css"/>
</head>

<body> 
    <div class="box-login">
        <i class="bi bi-lock-fill"></i>
        <h3>Login</h3>
        <p>Sistema de Autenticação</p>

        <div class="Userbox">
            <label for="user">Usuário:</label>
            <input type="text" id="user">
        </div>
        
        <div class="password-wrapper">
            <label for="senha">Senha:</label>
            <div  class="passwordbox">
                  <input type="password" id="senha" >
                  <i id="toggleSenha" class="bi bi-eye-fill"></i>
             </div>
        </div>

        <div>
            <input type="checkbox" id="termodeuso" >
            <label for="termodeuso">Li e concordo com os termos de uso.</label>
        </div>

        <div>
            <button type="button" onclick="logar()">Entrar</button>
        </div>
    </div>

    <Script src="login.js">

    </Script>
</body>

</html>
